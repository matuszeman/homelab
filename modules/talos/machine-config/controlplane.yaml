# Controlplane Talos cluster config patch
cluster:
  #clusterName: ${cluster_config.cluster_name}
#  controlPlane:
#    endpoint: https://${cluster_config.vip_dns} # Endpoint is the canonical controlplane endpoint, which can be an IP address or a DNS hostname.
  allowSchedulingOnControlPlanes: ${cluster_config.allow_scheduling_on_control_planes}
  etcd:
    advertisedSubnets:
      - ${cluster_config.network.cidr}
  apiServer:
    extraArgs:
      feature-gates: "UserNamespacesSupport=true"
    certSANs:
      - 127.0.0.1
      - ${cluster_config.vip_dns}
      - ${cluster_config.vip_ip}
machine:
  certSANs:
    - ${cluster_config.vip_dns}
    - ${cluster_config.vip_ip}
  nodeLabels:
    #%{ if cluster_config.allow_scheduling_on_control_planes }
    node.kubernetes.io/exclude-from-external-load-balancers:
      $patch: delete
    #%{ endif }
