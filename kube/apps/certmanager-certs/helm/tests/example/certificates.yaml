issuers:
  configs:
    secrets:
      secret: {}

certificates:
  my-cert:
    enabled: true
    commonName: example.com
    dnsNames:
      - example.com
      - "*.example.com"
    issuer: letsencrypt
    secretTemplate:
      annotations:
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "my-app"
      labels:
        my-label: my-value
