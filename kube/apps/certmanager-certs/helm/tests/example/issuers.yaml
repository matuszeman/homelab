issuers:
  letsencrypt:
    enabled: true
    email: "admin@example.com"
    solvers:
      - dns01:
          cloudflare:
            email: "admin@example.com"
            apiTokenSecretRef:
              name: certmanager-certs-config-secrets
              key: cloudflare-api-token

  configs:
    secrets:
      secret: {}
      content:
        cloudflare-api-token: "my-token"
