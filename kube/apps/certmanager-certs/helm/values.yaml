global:
  cluster: "_"
  idpAppConfig:
    clusters:
      _: {}
    defaults:
      configs:
        annotations: { }

issuers:
  appName: "certmanager-issuers"
  appVersion: "1.0.0"

  letsencrypt:
    enabled: false
    email: null
    server: https://acme-v02.api.letsencrypt.org/directory
    solvers: []

  letsencrypt-staging:
    enabled: false
    email: null
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    solvers: []

  configs:
    secrets:
      content: {}
        #cloudfront_api_key: "eee"

# Gateway Reference Grants configuration
# Allows gateways in other namespaces to reference secrets from this namespace
secretsReferenceGrants: {}
  # Example configuration:
  # my-gateway:
  #   kind: Gateway
  #   namespace: traefik-system
  #   labels: {}
  #   annotations: {}

certificates: {}
