app:
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      effect: NoSchedule

  storageClass:
    - name: proxmox-data-xfs
      storage: data
      reclaimPolicy: Delete
      fstype: xfs
    - name: proxmox-data
      storage: data
      reclaimPolicy: Delete

config:
  appName: sci-proxmox-config
  appVersion: 1.0.0
  configs:
    secret:
      secret: {}
      content:
        config.yaml:
          clusters:
            - url: https://cluster-api-1.exmple.com:8006/api2/json
              insecure: false
              token_id: "kubernetes-csi@pve!csi"
              token_secret: "secret"
              region: Region-1
            - url: https://cluster-api-2.exmple.com:8006/api2/json
              insecure: false
              token_id: "kubernetes-csi@pve!csi"
              token_secret: "secret"
              region: Region-2
