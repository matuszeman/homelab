# Test values for alloy sending logs to Grafana Cloud with secret injection
app:
  alloy:
    configMap:
      content: |
        logging {
          level  = "info"
          format = "logfmt"
        }

        discovery.kubernetes "pods" {
          role = "pod"
        }

        loki.source.kubernetes "pods" {
          targets    = discovery.kubernetes.pods.targets
          forward_to = [loki.write.grafana_cloud.receiver]
        }

        loki.write "grafana_cloud" {
          endpoint {
            url = "https://logs-prod-us-central1.grafana.net/loki/api/v1/push"
          }
          basic_auth {
            username = "${GRAFANA_CLOUD_USER}"
            password = "${GRAFANA_CLOUD_TOKEN}"
          }
        }

    envFrom:
      - secretRef:
          name: release-name-config-grafana-cloud

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

# idp-app configuration for creating Grafana Cloud credentials Secret
config:
  appName: alloy
  appVersion: "1.0.0"
  configs:
    grafana-cloud:
      secret: {}  # Creates a Secret instead of ConfigMap
      content:
        GRAFANA_CLOUD_USER: "user@example.com"
        GRAFANA_CLOUD_TOKEN: "glc_xxxxxxxxxxxxxxxxxxxx"
