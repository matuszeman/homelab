# idp-app - this should be fixed in idp-app
global:
  idpAppConfig:
    clusters:
      _: {}
    imageRepositories:
      docker.io: docker.io
    defaults:
      imageRepository: docker.io
      configs:
        annotations: {}
# END

# ---------------------------------------------------------------------------
# app — Apprise API (caronc/apprise)
# https://github.com/caronc/apprise-api
# ---------------------------------------------------------------------------
app:
  appName: apprise
  appVersion: 1.3.1

  podDisruptionBudget:
    enabled: false
  serviceAccount:
    create: true
  deployment:
    enabled: true
  service:
    enabled: true
    port: 80
  containers:
    app:
      resources:
        requests:
          memory: 50Mi
          cpu: 1m
      containerPort: 8000
      # https://hub.docker.com/r/caronc/apprise
      imageRepository: docker.io
      image: caronc/apprise
      imageTag: 1.3.1
      # configDirs mounts the entire "app" ConfigMap as /config directory.
      # The apprise.yml file inside will be loaded by APPRISE_CONFIG_DIR.
      configDirs:
        app: /config
      volumeMounts:
        attach:
          mountPath: /attach
        storage:
          mountPath: /storage
      # https://github.com/caronc/apprise-api?tab=readme-ov-file#environment-variables
      env:
        PUID: 3000
        GUID: 3000
        # https://github.com/caronc/apprise-api/blob/c571bb067130d3987b4521c77a7d5fb740bbdfa0/apprise_api/core/settings/__init__.py#L150
        IPV4_ONLY: true
        APPRISE_WORKER_COUNT: 1
        APPRISE_STATEFUL_MODE: simple
        APPRISE_CONFIG_DIR: /config
        APPRISE_CONFIG_LOCK: yes
        APPRISE_ATTACH_DIR: /attach
        APPRISE_STORAGE_DIR: /storage
        LOG_LEVEL: debug
        #HASSIO_APPRISE_TOKEN: {config: {name: secrets, key: HASSIO_APPRISE_TOKEN }}
  volumes:
    # Ephemeral in-memory volumes for attachments and notification storage.
    storage:
      emptyDir:
        sizeLimit: 50Mi
        medium: Memory
    attach:
      emptyDir:
        sizeLimit: 50Mi
        medium: Memory
  configs:
    app:
      # Triggers a rolling restart whenever apprise.yml changes.
      restartPodOnUpdate: true
      content:
        # https://github.com/caronc/apprise/wiki/config_yaml
        # https://github.com/caronc/apprise/wiki/Notify_homeassistant
        #
        # Note: Apprise does not support injecting secrets from env vars until
        # https://github.com/caronc/apprise/issues/1156 is resolved.
        # Set to null here; override in a separate values file or sealed secret.
        apprise.yml: null

# ---------------------------------------------------------------------------
# smtp — Mailrise SMTP-to-Apprise gateway (yoryan/mailrise)
# https://github.com/YoRyan/mailrise
# ---------------------------------------------------------------------------
smtp:
  appName: mailrise
  appVersion: 1.3.0
  # resourceNameSuffix prevents resource name collisions with the "app" release.
  resourceNameSuffix: smtp

  podDisruptionBudget:
    enabled: false
  serviceAccount:
    create: true
  deployment:
    enabled: true
  service:
    enabled: true
    # Mailrise listens on the standard SMTP port.
    port: 25
  containers:
    app:
      resources:
        requests:
          memory: 50Mi
          cpu: 1m
      containerPort: 8025
      imageRepository: docker.io
      image: yoryan/mailrise
      imageTag: 1.3.0
      # configFiles mounts mailrise.conf from the "app" ConfigMap at the exact path
      # expected by the mailrise binary.
      configFiles:
        app:
          mailrise.conf: /etc/mailrise.conf
  configs:
    app:
      # Triggers a rolling restart whenever mailrise.conf changes.
      restartPodOnUpdate: true
      content:
        # https://github.com/YoRyan/mailrise#configuration
        # Set to null here; override in a separate values file.
        mailrise.conf: null
