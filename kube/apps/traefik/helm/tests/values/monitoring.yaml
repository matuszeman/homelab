app:
  log:
    level: INFO
    format: common
    noColor: true
  accessLog:
    enabled: true
    format: common
    filters:
      statusCodes: "400-499,500-599"
    fields:
      defaultMode: "keep"
      names:
        ClientHost: "drop"
      headers:
        defaultMode: "drop"
        names:
          "User-Agent": "keep"
          "Referer": "keep"
          "X-Forwarded-For": "keep"
          "X-Request-Id": "keep"
          "X-Forwarded-Host":  "keep"
          "X-Forwarded-Proto": "keep"
          "Host": "keep"
